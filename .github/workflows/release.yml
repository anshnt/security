name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish Windows executables
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,yara]"

      - name: Tests
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home
        run: pytest -q

      - name: Build executables
        run: |
          pyinstaller packaging/aegis.spec --noconfirm --clean --distpath dist --workpath build
          pyinstaller packaging/aegis-gui.spec --noconfirm --clean --distpath dist --workpath build

      - name: Smoke test
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home-exe
        run: |
          ./dist/aegis.exe --version
          ./dist/aegis.exe info
          rc=0; ./dist/aegis.exe scan audit -q || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi

      - name: Package
        shell: pwsh
        run: |
          $ver = $env:TAG
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\aegis.exe, dist\aegis-gui.exe release\
          Copy-Item README.md, LICENSE, CHANGELOG.md release\
          Copy-Item scripts\install_windows.ps1, scripts\uninstall_windows.ps1 release\
          Compress-Archive -Path release\* -DestinationPath "aegis-$ver-windows-x64.zip" -Force
          Get-ChildItem "aegis-$ver-windows-x64.zip", dist\aegis.exe, dist\aegis-gui.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v t="## [${TAG#v}]" 'index($0,t)==1{p=1;next} p&&/^## \[/{exit} p' CHANGELOG.md)
          printf '%s\n\n%s\n' "$notes" "**Unsigned build:** Windows SmartScreen may warn on first run. Verify the download against SHA256SUMS.txt." > notes.md
          files="aegis-$TAG-windows-x64.zip dist/aegis.exe dist/aegis-gui.exe SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --title "Aegis Security Suite $TAG" --notes-file notes.md
          fi
