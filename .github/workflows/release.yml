name: Release

on:
  push:
    tags: ["v*"]
    # a version bump merged to main releases that version, so nobody has to push a tag by hand
    branches: [main]
    paths: ["aegis/__init__.py"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  plan:
    name: Decide the release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}

      - id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(grep -m1 '^__version__' aegis/__init__.py | cut -d'"' -f2)
            if [ -z "$version" ]; then echo "::error::no __version__ in aegis/__init__.py"; exit 1; fi
            tag="v$version"
            # the file also changes for other reasons; only a version without a tag is released
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "$tag is already tagged, nothing to release"
              tag=""
            fi
          fi
          echo "release tag: ${tag:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    name: Build and publish Windows executables
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: windows-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,yara]"

      - name: Tests
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home
        run: pytest -q

      - name: Build executables
        run: |
          pyinstaller packaging/aegis.spec --noconfirm --clean --distpath dist --workpath build
          pyinstaller packaging/aegis-gui.spec --noconfirm --clean --distpath dist --workpath build

      - name: Smoke test
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home-exe
        run: |
          ./dist/aegis.exe --version
          ./dist/aegis.exe info
          rc=0; ./dist/aegis.exe scan audit -q || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi

      - name: Package
        shell: pwsh
        run: |
          $ver = $env:TAG
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\aegis.exe, dist\aegis-gui.exe release\
          Copy-Item README.md, LICENSE, CHANGELOG.md release\
          Copy-Item scripts\install_windows.ps1, scripts\uninstall_windows.ps1 release\
          Compress-Archive -Path release\* -DestinationPath "aegis-$ver-windows-x64.zip" -Force
          Get-ChildItem "aegis-$ver-windows-x64.zip", dist\aegis.exe, dist\aegis-gui.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v t="## [${TAG#v}]" 'index($0,t)==1{p=1;next} p&&/^## \[/{exit} p' CHANGELOG.md)
          printf '%s\n\n%s\n' "$notes" "**Unsigned build:** Windows SmartScreen may warn on first run. Verify the download against SHA256SUMS.txt." > notes.md
          files="aegis-$TAG-windows-x64.zip dist/aegis.exe dist/aegis-gui.exe SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            # --target creates the tag on this commit when the release comes from a version bump on main
            gh release create "$TAG" $files --target "$GITHUB_SHA" --title "Aegis Security Suite $TAG" --notes-file notes.md
          fi
