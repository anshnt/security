name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # native YARA is optional: wheels exist for Windows; on Linux it may need to build, so never fail the job
          pip install "yara-python>=4.3" || echo "yara-python not available - testing the built-in rule engine only"

      - name: Tests
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home
        run: pytest -q

      - name: Smoke - aegis info
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home
        run: python -m aegis info

      - name: Smoke - files scanner over tests/
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home
        run: |
          # exit codes: 0 = clean, 1 = findings, 2 = error. Only 2+ is a failure.
          rc=0
          python -m aegis scan custom --scanners files --path tests || rc=$?
          echo "scan exit code: $rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi

  build-windows:
    name: build Windows executables
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "yara-python>=4.3" || echo "building without native YARA"

      - name: Build aegis.exe (console)
        run: pyinstaller packaging/aegis.spec --noconfirm --clean --distpath dist --workpath build

      - name: Build aegis-gui.exe (windowed)
        run: pyinstaller packaging/aegis-gui.spec --noconfirm --clean --distpath dist --workpath build

      - name: Smoke test the executable
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home-exe
        run: |
          ./dist/aegis.exe info
          rc=0
          ./dist/aegis.exe scan custom --scanners files --path tests || rc=$?
          echo "scan exit code: $rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-windows
          path: |
            dist/aegis.exe
            dist/aegis-gui.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
