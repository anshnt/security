name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # native YARA is optional: wheels exist for Windows; on Linux it may need to build, so never fail the job
          pip install "yara-python>=4.3" || echo "yara-python not available - testing the built-in rule engine only"

      - name: Install Xvfb (GUI tests on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Tests
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home
        run: |
          # On Linux run under a virtual display so tests/test_gui_real.py drives the real Tk app.
          # A test stuck for 2 minutes dumps the traceback of every thread (faulthandler), so a hang is never silent.
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a pytest -q -rs -o faulthandler_timeout=120
          else pytest -q -rs -o faulthandler_timeout=120; fi

      - name: Smoke - aegis info
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home
        run: python -m aegis info

      - name: Smoke - files scanner over tests/
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home
        run: |
          # exit codes: 0 = clean, 1 = findings, 2 = error. Only 2+ is a failure.
          rc=0
          python -m aegis scan custom --scanners files --path tests || rc=$?
          echo "scan exit code: $rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi

      - name: Real-macOS end-to-end (every macOS scanner, as the user and as root)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # A real Mac: launchd, TCC, quarantine attributes, Gatekeeper/SIP/FileVault, PAM and the screen lock are real.
          # Two harmless downloads with a quarantine record and kMDItemWhereFroms, as Safari writes them:
          mkdir -p ~/Downloads
          for name in aegis-e2e-setup.dmg aegis-e2e-movie.iso; do
            printf 'harmless Aegis CI test file\n' > ~/Downloads/$name
            xattr -w com.apple.quarantine "0083;65a1b2c3;Safari;" ~/Downloads/$name
          done
          python - <<'PY'
          import os, plistlib, subprocess
          home = os.path.expanduser("~/Downloads")
          for name, urls in (("aegis-e2e-setup.dmg", ["http://45.9.148.10/dl/aegis-e2e-setup.dmg?token=E2ESECRET",
                                                      "https://share.example/page"]),
                             ("aegis-e2e-movie.iso", ["blob:https://share.example/0d7c4f1e-5b7a-4a43-9a51-7e8c2f0b1a2c"])):
              data = plistlib.dumps(urls, fmt=plistlib.FMT_BINARY)
              subprocess.run(["xattr", "-wx", "com.apple.metadata:kMDItemWhereFroms", data.hex(), os.path.join(home, name)],
                             check=True)
          PY
          scan() {  # name, then scan arguments
            local name="$1"; shift
            rc=0
            AEGIS_HOME="$RUNNER_TEMP/aegis-home-mac" python -m aegis scan "$@" --json > "mac-$name.json" || rc=$?
            echo "$name exit code: $rc"
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi
          }
          scan audit audit
          scan quick quick
          scan hunt custom --scanners secrets,email,supplychain,ide,privacy,apptamper,traces,recovery,usb,remoteaccess
          rc=0
          sudo env "PATH=$PATH" AEGIS_HOME="$RUNNER_TEMP/aegis-home-mac-root" python -m aegis scan custom \
            --scanners system_audit,persistence,privacy,processes,network --json > mac-root.json || rc=$?
          echo "root exit code: $rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi
          python - <<'PY'
          import json, sys
          bad = False
          for name in ("audit", "quick", "hunt", "root"):
              d = json.load(open(f"mac-{name}.json", encoding="utf-8"))
              print(f"{name}: score {d['score']} ({d['grade']}), scanners {d['scanners']}, counts {d['counts']}, "
                    f"checks {sum(c['status'] == 'pass' for c in d['checks'])}/{len(d['checks'])} pass")
              for c in d["checks"]:
                  if c["status"] != "pass":
                      print(f"   {c['status']:<5} {c['check_id']:<34} {c['detail'][:150]}")
                  if c["status"] == "error":
                      bad = True
              for f in d["findings"]:
                  print(f"   F {f['severity']:<8} {f['rule_id']:<30} {f['title'][:110]}")
              for e in d["errors"]:
                  print(f"   SCANNER ERROR: {e}")
                  bad = True
          quick = open("mac-quick.json", encoding="utf-8").read()
          got = {(f["rule_id"], f["evidence"].get("file")) for f in json.loads(quick)["findings"] if f["scanner"] == "downloads"}
          print("download origin review:", sorted(got))
          if not {("AEG-DL-RAWIP", "aegis-e2e-setup.dmg"), ("AEG-DL-SMUGGLED", "aegis-e2e-movie.iso")} <= got or "E2ESECRET" in quick:
              print("   EXPECTED the planted downloads to be reported, without the token in their address")
              bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Real-Linux end-to-end (hardening audit and autostart review, as the user and as root)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The runner is a virtual machine, not a container: /proc/sys, /sys/module, PAM, systemd and cron are real.
          run_scan() {  # name, then command
            local name="$1"; shift
            rc=0
            "$@" scan custom --scanners system_audit,persistence --json > "linux-$name.json" || rc=$?
            echo "$name exit code: $rc"
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi
          }
          AEGIS_HOME="$RUNNER_TEMP/aegis-home-user" run_scan user python -m aegis
          sudo env "PATH=$PATH" AEGIS_HOME="$RUNNER_TEMP/aegis-home-root" python -m aegis --version
          rc=0
          sudo env "PATH=$PATH" AEGIS_HOME="$RUNNER_TEMP/aegis-home-root" python -m aegis scan custom \
            --scanners system_audit,persistence --json > linux-root.json || rc=$?
          echo "root exit code: $rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi
          python - <<'PY'
          import json, sys
          bad = False
          for name in ("user", "root"):
              d = json.load(open(f"linux-{name}.json", encoding="utf-8"))
              print(f"{name}: score {d['score']} ({d['grade']}), counts {d['counts']}")
              for c in d["checks"]:
                  if c["status"] != "pass" or c["check_id"].startswith(("AEG-AUDIT-KERNEL", "AEG-AUDIT-SCREENLOCK")):
                      print(f"   {c['status']:<5} {c['check_id']:<34} {c['detail'][:150]}")
                  if c["status"] == "error":
                      bad = True
              for f in d["findings"]:
                  print(f"   F {f['severity']:<8} {f['rule_id']:<30} {f['title'][:110]}")
              for e in d["errors"]:
                  print(f"   SCANNER ERROR: {e}")
                  bad = True
          sys.exit(1 if bad else 0)
          PY

  build-windows:
    name: build Windows executables
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "yara-python>=4.3" || echo "building without native YARA"

      - name: Build aegis.exe (console)
        run: pyinstaller packaging/aegis.spec --noconfirm --clean --distpath dist --workpath build

      - name: Build aegis-gui.exe (windowed)
        run: pyinstaller packaging/aegis-gui.spec --noconfirm --clean --distpath dist --workpath build

      - name: Smoke test the executable
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home-exe
        run: |
          ./dist/aegis.exe info
          rc=0
          ./dist/aegis.exe scan custom --scanners files --path tests || rc=$?
          echo "scan exit code: $rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi

      - name: Boot configuration diagnostics (cross-check the drivers scanner)
        shell: cmd
        continue-on-error: true
        run: |
          bcdedit /enum {current} | findstr /i "testsigning nointegritychecks debug hypervisorlaunchtype"
          reg query HKLM\SYSTEM\CurrentControlSet\Control /v SystemStartOptions

      - name: Real-Windows end-to-end (audit + quick scan with every scanner)
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home-e2e
        run: |
          # Runs the packaged exe against the live runner: registry, PowerShell, WMI,
          # Task Scheduler, services, certificates, browsers... Findings are expected
          # (it's a CI box); internal scanner errors are not.
          mkdir -p e2e
          # harmless files in Downloads with a recorded origin (Mark-of-the-Web) for the download-origin review
          python - <<'PY'
          import os
          d = os.path.join(os.environ["USERPROFILE"], "Downloads")
          os.makedirs(d, exist_ok=True)
          for name, host in (("aegis-e2e-setup.exe", "http://45.9.148.10/dl/aegis-e2e-setup.exe?token=E2ESECRET"),
                             ("aegis-e2e-movie.iso", "blob:https://share.example/0d7c4f1e-5b7a-4a43-9a51-7e8c2f0b1a2c"),
                             ("aegis-e2e-invoice.pdf.exe", "https://cdn.example/invoice.pdf.exe")):
              path = os.path.join(d, name)
              with open(path, "wb") as fh:
                  fh.write(b"harmless Aegis CI test file\r\n")
              with open(path + ":Zone.Identifier", "w", newline="") as fh:
                  fh.write(f"[ZoneTransfer]\r\nZoneId=3\r\nReferrerUrl=https://share.example/page\r\nHostUrl={host}\r\n")
          PY
          run_scan() {  # name, then scan arguments
            local name="$1"; shift
            rc=0
            ./dist/aegis.exe scan "$@" --json --report "e2e/$name.html" > "e2e/$name.json" || rc=$?
            echo "$name exit code: $rc"
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi
          }
          run_scan audit audit
          run_scan quick quick
          # threat-hunting scanners: event logs, drivers, sideloading, USB, email, process memory, privacy, app tampering,
          # recent-activity traces (ClickFix commands, DNS cache, browser history), remote-access tools
          run_scan hunt custom --scanners eventlog,drivers,sideload,usb,email,memory,supplychain,ide,privacy,apptamper,traces,remoteaccess
          # deep scan of a large tree: exercises the multi-process file scanner inside the frozen exe
          run_scan deepfiles custom --scanners files --deep --path "$pythonLocation/Lib"
          python - <<'PY'
          import json, sys
          bad = False
          for profile in ("audit", "quick", "hunt", "deepfiles"):
              d = json.load(open(f"e2e/{profile}.json", encoding="utf-8"))
              print(f"{profile}: score {d['score']} ({d['grade']}), scanners {d['scanners']}, counts {d['counts']}, "
                    f"checks {sum(c['status'] == 'pass' for c in d['checks'])}/{len(d['checks'])} pass, "
                    f"{d['stats'].get('duration_s')}s, files {d['stats'].get('files_scanned', '-')}, "
                    f"workers {d['stats'].get('file_scan_workers', '-')}")
              for f in d["findings"][:15]:
                  print(f"   {f['severity']:<8} {f['rule_id']:<28} {f['title'][:70]}")
              for c in d["checks"]:
                  if c["status"] == "error":
                      print(f"   CHECK ERROR {c['check_id']}: {c['detail'][:200]}")
                      bad = True
              for e in d["errors"]:
                  print(f"   SCANNER ERROR: {e}")
                  bad = True
          quick = open("e2e/quick.json", encoding="utf-8").read()
          got = {(f["rule_id"], f["evidence"].get("file")) for f in json.loads(quick)["findings"] if f["scanner"] == "downloads"}
          want = {("AEG-DL-RAWIP", "aegis-e2e-setup.exe"), ("AEG-DL-SMUGGLED", "aegis-e2e-movie.iso"),
                  ("AEG-DL-DECEPTIVE", "aegis-e2e-invoice.pdf.exe")}
          print("download origin review:", sorted(got))
          if not want <= got or "E2ESECRET" in quick:
              print("   EXPECTED the planted downloads to be reported, without the token in their address")
              bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Real-Windows smoke - v1.1 commands in the packaged exe
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home-e2e
        run: |
          set -o pipefail
          ok() { local rc=0; "$@" || rc=$?; echo ">> $* -> exit $rc"; [ "$rc" -le 1 ] || exit "$rc"; }
          ok ./dist/aegis.exe sigma list          # PyYAML + bundled Sigma rules made it into the exe
          ok ./dist/aegis.exe doctor
          ok ./dist/aegis.exe harden              # plan only - never applied in CI
          ok ./dist/aegis.exe harden --profile strict
          ok ./dist/aegis.exe protect web status
          ok ./dist/aegis.exe protect ips status
          ok ./dist/aegis.exe history
          ok ./dist/aegis.exe history diff
          ok ./dist/aegis.exe undo list
          ok ./dist/aegis.exe alert status
          # v1.2: SARIF from a real scan, and the software updater against the runner's real winget
          ok ./dist/aegis.exe report e2e/audit.sarif --input e2e/audit.json
          ok ./dist/aegis.exe fleet e2e -o e2e/fleet.html   # one overview built from this run's real scan results
          python -c "import json; d = json.load(open('e2e/audit.sarif', encoding='utf-8')); r = d['runs'][0]; print('SARIF', d['version'], len(r['results']), 'results,', len(r['tool']['driver']['rules']), 'rules')"
          ./dist/aegis.exe apps list || echo ">> apps list exit $? (1 = updates pending; 2 = winget unavailable or offline, not a failure here)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegis-windows-e2e-reports
          path: e2e/
          if-no-files-found: ignore

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-windows
          path: |
            dist/aegis.exe
            dist/aegis-gui.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
