name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # native YARA is optional: wheels exist for Windows; on Linux it may need to build, so never fail the job
          pip install "yara-python>=4.3" || echo "yara-python not available - testing the built-in rule engine only"

      - name: Install Xvfb (GUI tests on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Tests
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home
        run: |
          # On Linux run under a virtual display so tests/test_gui_real.py drives the real Tk app.
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a pytest -q -rs; else pytest -q -rs; fi

      - name: Smoke - aegis info
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home
        run: python -m aegis info

      - name: Smoke - files scanner over tests/
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home
        run: |
          # exit codes: 0 = clean, 1 = findings, 2 = error. Only 2+ is a failure.
          rc=0
          python -m aegis scan custom --scanners files --path tests || rc=$?
          echo "scan exit code: $rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi

  build-windows:
    name: build Windows executables
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "yara-python>=4.3" || echo "building without native YARA"

      - name: Build aegis.exe (console)
        run: pyinstaller packaging/aegis.spec --noconfirm --clean --distpath dist --workpath build

      - name: Build aegis-gui.exe (windowed)
        run: pyinstaller packaging/aegis-gui.spec --noconfirm --clean --distpath dist --workpath build

      - name: Smoke test the executable
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home-exe
        run: |
          ./dist/aegis.exe info
          rc=0
          ./dist/aegis.exe scan custom --scanners files --path tests || rc=$?
          echo "scan exit code: $rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi

      - name: Boot configuration diagnostics (cross-check the drivers scanner)
        shell: cmd
        continue-on-error: true
        run: |
          bcdedit /enum {current} | findstr /i "testsigning nointegritychecks debug hypervisorlaunchtype"
          reg query HKLM\SYSTEM\CurrentControlSet\Control /v SystemStartOptions

      - name: Real-Windows end-to-end (audit + quick scan with every scanner)
        shell: bash
        env:
          AEGIS_HOME: ${{ runner.temp }}/aegis-home-e2e
        run: |
          # Runs the packaged exe against the live runner: registry, PowerShell, WMI,
          # Task Scheduler, services, certificates, browsers... Findings are expected
          # (it's a CI box); internal scanner errors are not.
          mkdir -p e2e
          run_scan() {  # name, then scan arguments
            local name="$1"; shift
            rc=0
            ./dist/aegis.exe scan "$@" --json --report "e2e/$name.html" > "e2e/$name.json" || rc=$?
            echo "$name exit code: $rc"
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi
          }
          run_scan audit audit
          run_scan quick quick
          # threat-hunting scanners: event logs, drivers, sideloading, USB, email, process memory
          run_scan hunt custom --scanners eventlog,drivers,sideload,usb,email,memory
          python - <<'PY'
          import json, sys
          bad = False
          for profile in ("audit", "quick", "hunt"):
              d = json.load(open(f"e2e/{profile}.json", encoding="utf-8"))
              print(f"{profile}: score {d['score']} ({d['grade']}), scanners {d['scanners']}, counts {d['counts']}, "
                    f"checks {sum(c['status'] == 'pass' for c in d['checks'])}/{len(d['checks'])} pass, "
                    f"{d['stats'].get('duration_s')}s")
              for f in d["findings"][:15]:
                  print(f"   {f['severity']:<8} {f['rule_id']:<28} {f['title'][:70]}")
              for c in d["checks"]:
                  if c["status"] == "error":
                      print(f"   CHECK ERROR {c['check_id']}: {c['detail'][:200]}")
                      bad = True
              for e in d["errors"]:
                  print(f"   SCANNER ERROR: {e}")
                  bad = True
          sys.exit(1 if bad else 0)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegis-windows-e2e-reports
          path: e2e/
          if-no-files-found: ignore

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-windows
          path: |
            dist/aegis.exe
            dist/aegis-gui.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
