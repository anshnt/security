title: Microsoft Defender Disabled or Broadly Excluded With PowerShell
id: 35e63b5f-8ecb-5e1e-b0a3-466b51f17efb
status: stable
description: Set-MpPreference or Add-MpPreference was used to switch off a Microsoft Defender protection or to exclude a very broad location (a whole drive, Users, Temp, Downloads), file type or script engine from scanning. Malware does this so it is never scanned.
references:
    - https://attack.mitre.org/techniques/T1685/
    - https://learn.microsoft.com/powershell/module/defender/set-mppreference
author: Aegis Security Suite
date: 2026-10-16
license: MIT
tags:
    - attack.defense-evasion
    - attack.t1685
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith:
              - '\powershell.exe'
              - '\pwsh.exe'
              - '\powershell_ise.exe'
        - OriginalFileName:
              - 'PowerShell.EXE'
              - 'pwsh.dll'
              - 'PowerShell_ISE.EXE'
    selection_cmdlet:
        CommandLine|contains:
            - 'Set-MpPreference'
            - 'Add-MpPreference'
    selection_disable:
        CommandLine|re: '(?i)-Disable(?:RealtimeMonitoring|BehaviorMonitoring|IOAVProtection|ScriptScanning|IntrusionPreventionSystem|BlockAtFirstSeen|ArchiveScanning)\s+[$]?(?:true|1)\b'
    selection_excl_path:
        CommandLine|re: '(?i)-ExclusionPath\s+@?\(?\s*["'']?(?:[a-z]:\\?|[a-z]:\\(?:users|windows|programdata|users\\public)\\?|\*|%(?:temp|tmp|appdata|localappdata|programdata|userprofile|public)%\\?|[$]env:(?:temp|tmp|appdata|localappdata|programdata|userprofile|public)\\?|[^\s"'',;)]*\\(?:temp|downloads)\\?)["'']?(?:[\s,;)"'']|$)'
    selection_excl_ext:
        CommandLine|re: '(?i)-ExclusionExtension\s+@?\(?\s*["'']?\.?(?:exe|dll|ps1|bat|cmd|vbs|js|hta|scr|lnk|zip|iso)["'']?(?:[\s,;)"'']|$)'
    selection_excl_proc:
        CommandLine|re: '(?i)-ExclusionProcess\s+@?\(?\s*["'']?[^\s"'',;)]*(?:powershell|pwsh|cmd|wscript|cscript|mshta|rundll32|regsvr32)(?:\.exe)?["'']?(?:[\s,;)"'']|$)'
    condition: selection_img and selection_cmdlet and (selection_disable or 1 of selection_excl_*)
falsepositives:
    - Administrators who exclude a large, trusted build or backup location from scanning
level: high
