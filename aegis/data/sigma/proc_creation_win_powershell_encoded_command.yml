title: PowerShell Started With an Encoded Command
id: d2716a53-92a8-50af-82a4-af87c431508f
status: stable
description: PowerShell was started with a Base64 -EncodedCommand argument. Attackers use it to hide the script they run from casual inspection; some management and deployment tools do too.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1027/010/
author: Aegis Security Suite
date: 2026-10-16
license: MIT
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense-evasion
    - attack.t1027.010
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith:
              - '\powershell.exe'
              - '\pwsh.exe'
              - '\powershell_ise.exe'
        - OriginalFileName:
              - 'PowerShell.EXE'
              - 'pwsh.dll'
              - 'PowerShell_ISE.EXE'
    selection_encoded:
        CommandLine|re: '(?i)\s[-/\u2013\u2014\u2015]e(?:c|n|nc|nco|ncod|ncode|ncoded|ncodedc|ncodedco|ncodedcom|ncodedcomm|ncodedcomma|ncodedcomman|ncodedcommand)?\s+["'']?[A-Za-z0-9+/=]{24,}'
    condition: selection_img and selection_encoded
falsepositives:
    - Software deployment, inventory and management agents that pass scripts as encoded commands
    - Administrators running scripts through remote management tools
level: medium
