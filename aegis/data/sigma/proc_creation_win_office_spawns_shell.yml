title: Office Application Starts a Shell or Script Engine
id: 086d9741-43ae-55c9-9be9-0e9d8b6e79f4
status: stable
description: A Microsoft Office program (or a PDF reader) started a command shell, script host or download tool. Documents do not normally do this; malicious macros and exploits do.
references:
    - https://attack.mitre.org/techniques/T1204/002/
    - https://attack.mitre.org/techniques/T1566/001/
author: Aegis Security Suite
date: 2026-10-16
license: MIT
tags:
    - attack.execution
    - attack.t1204.002
    - attack.t1059
    - attack.initial-access
    - attack.t1566.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\msaccess.exe'
            - '\mspub.exe'
            - '\onenote.exe'
            - '\visio.exe'
            - '\eqnedt32.exe'
    selection_child:
        - Image|endswith:
              - '\cmd.exe'
              - '\powershell.exe'
              - '\pwsh.exe'
              - '\wscript.exe'
              - '\cscript.exe'
              - '\mshta.exe'
              - '\regsvr32.exe'
              - '\certutil.exe'
              - '\bitsadmin.exe'
              - '\msbuild.exe'
              - '\wmic.exe'
              - '\cmstp.exe'
              - '\installutil.exe'
        - OriginalFileName:
              - 'Cmd.Exe'
              - 'PowerShell.EXE'
              - 'pwsh.dll'
              - 'wscript.exe'
              - 'cscript.exe'
              - 'MSHTA.EXE'
              - 'REGSVR32.EXE'
              - 'CertUtil.exe'
              - 'bitsadmin.exe'
              - 'MSBuild.exe'
              - 'wmic.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Excel or Word add-ins and legacy macros that deliberately start cmd.exe or a script
level: high
